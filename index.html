  </head>
  <body class="font-sans antialiased text-slate-800 bg-slate-50 selection:bg-emerald-600 selection:text-white">
    <div id="root">
      <div id="infinity-loader" style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #f8fafc; font-family: 'Hind Siliguri', sans-serif; text-align: center; padding: 20px;">
        <div style="width: 44px; height: 44px; border: 4px solid #e2e8f0; border-top-color: #059669; border-radius: 50%; animation: spin 0.8s linear infinite;"></div>
        <h2 style="margin-top: 16px; font-size: 19px; font-weight: 700; color: #0f172a;">মেসার্স ভাই ভাই ভুসি ও গো-খাদ্য ভাণ্ডার</h2>
        <p style="margin-top: 6px; font-size: 13px; color: #64748b;">লোড হচ্ছে, অনুগ্রহ করে একটু অপেক্ষা করুন...</p>
      </div>
      <style>
        @keyframes spin { to { transform: rotate(360deg); } }
      </style>
    </div>

    <!-- Vite Development Entrypoint -->
    <script type="module" src="/src/main.tsx"></script>

    <!-- InfinityFree / Static Host Automatic Fallback Bridge with Cache Busting -->
    <script>
      (function() {
        var bundleLoaded = false;
        function loadProductionBundle() {
          if (bundleLoaded || window.__APP_INITIALIZED__) return;
          bundleLoaded = true;
          var bust = '?v=' + Date.now();
          
          var script = document.createElement('script');
          script.type = 'module';
          script.crossOrigin = 'anonymous';
          script.src = './assets/app.js' + bust;
          script.onerror = function() {
            var distScript = document.createElement('script');
            distScript.type = 'module';
            distScript.crossOrigin = 'anonymous';
            distScript.src = './dist/assets/app.js' + bust;
            document.body.appendChild(distScript);
          };
          document.body.appendChild(script);
        }

        window.addEventListener('error', function() {
          if (!window.__APP_INITIALIZED__) {
            loadProductionBundle();
          }
        }, true);

        setTimeout(function() {
          if (!window.__APP_INITIALIZED__) {
            loadProductionBundle();
          }
        }, 120);
      })();
    </script>
  </body>
</html>
